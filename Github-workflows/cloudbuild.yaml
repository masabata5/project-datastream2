steps:

# ─────────────────────────────────────────────
# 1. Security Scan (IaC misconfig, vulnerable deps, secrets)
# ─────────────────────────────────────────────
- name: 'docker.io/aquasec/trivy:latest'
  id: 'trivy-scan'
  entrypoint: '/bin/sh'
  args:
  - '-c'
  - |
    echo "Running Trivy filesystem scan on codebase..."

    trivy fs \
      --scanners vuln,config,secret \
      --severity HIGH,CRITICAL \
      --ignore-unfixed \
      --exit-code 1 \
      --format json \
      --output trivy-report.json .

    SCAN_STATUS=$?
    echo $SCAN_STATUS > exit_status.txt

    if [ "$SCAN_STATUS" -ne 0 ]; then
      echo "🛑 HIGH or CRITICAL issues found. Build will stop after report upload."
    else
      echo "✅ No HIGH/CRITICAL issues found. Proceeding to build."
    fi

    # Never fail this step itself — let step 3 decide, after the report is uploaded
    exit 0

# ─────────────────────────────────────────────
# 2. Upload scan report to Cloud Storage (always runs, pass or fail)
# ─────────────────────────────────────────────
- name: 'gcr.io/cloud-builders/gsutil'
  id: 'upload-report'
  args:
  - cp
  - trivy-report.json
  - gs://${_TRIVY_REPORT_BUCKET}/$BUILD_ID/trivy-report.json

# ─────────────────────────────────────────────
# 3. Gatekeeper — stop the pipeline here if the scan failed
# ─────────────────────────────────────────────
- name: 'ubuntu'
  id: 'security-gate'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    EXIT_STATUS=$(cat exit_status.txt)
    if [ "$EXIT_STATUS" -ne 0 ]; then
      echo "🛑 SECURITY GATE FAILED — HIGH/CRITICAL issues found."
      echo "Report: gs://${_TRIVY_REPORT_BUCKET}/$BUILD_ID/trivy-report.json"
      echo "Terraform build steps will NOT run."
      exit 1
    else
      echo "✅ Security gate passed. Proceeding to Terraform."
    fi

# ─────────────────────────────────────────────
# 4. Terraform Init
# ─────────────────────────────────────────────
- name: 'hashicorp/terraform:1.9'
  id: 'tf-init'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd ${_TF_DIR}
    terraform init -input=false

# ─────────────────────────────────────────────
# 5. Terraform Plan (saved to a file so apply uses exactly what was planned)
# ─────────────────────────────────────────────
- name: 'hashicorp/terraform:1.9'
  id: 'tf-plan'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd ${_TF_DIR}
    terraform plan -input=false -out=tfplan

# ─────────────────────────────────────────────
# 6. Terraform Apply (only reached if steps 1–5 all succeeded)
# ─────────────────────────────────────────────
- name: 'hashicorp/terraform:1.9'
  id: 'tf-apply'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    cd ${_TF_DIR}
    terraform apply -input=false -auto-approve tfplan

substitutions:
  _TRIVY_REPORT_BUCKET: "project 2"
  _TF_DIR: "terraform"          # path to your Terraform root module in the repo

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s   # bumped up from 120s — scan + plan + apply need more roomadd . gcloud auth login